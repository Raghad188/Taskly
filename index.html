<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskly</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="toolbar" aria-label="إدارة المهام">
        <div>
          <p class="eyebrow">Taskly</p>
          <h1>مهامي اليوم</h1>
          <p id="notificationStatus" class="notification-status">الإشعارات غير مفعلة</p>
        </div>
        <button id="notificationButton" class="icon-button" type="button" title="تفعيل التذكيرات">
          🔔
        </button>
      </section>

      <form id="taskForm" class="task-form">
        <label>
          عنوان المهمة
          <input id="taskTitle" type="text" placeholder="مثال: قراءة 20 دقيقة" required />
        </label>

        <label>
          وصف المهمة
          <textarea id="taskDescription" placeholder="تفاصيل اختيارية عن المهمة"></textarea>
        </label>

        <label>
          الأولوية
          <select id="taskPriority">
            <option value="medium">متوسطة</option>
            <option value="high">عالية</option>
            <option value="low">منخفضة</option>
          </select>
        </label>

        <label>
          وقت التذكير
          <input id="taskReminder" type="datetime-local" />
        </label>

        <div class="form-actions">
          <button id="submitButton" type="submit">إضافة المهمة</button>
          <button id="cancelEditButton" class="secondary-button hidden" type="button">إلغاء</button>
        </div>
      </form>

      <section class="filters" aria-label="فلترة المهام">
        <button class="filter-button active" data-filter="all" type="button">الكل</button>
        <button class="filter-button" data-filter="pending" type="button">غير مكتملة</button>
        <button class="filter-button" data-filter="completed" type="button">مكتملة</button>
      </section>

      <section>
        <ul id="taskList" class="task-list" aria-live="polite"></ul>
        <p id="emptyState" class="empty-state">لا توجد مهام بعد. أضف أول مهمة وخلينا نبدأ.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
